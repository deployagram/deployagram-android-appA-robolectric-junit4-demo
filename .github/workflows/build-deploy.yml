# Builds and tests AppA on the JVM with Robolectric, then checks its contracts through Deployagram before a Prod release.
#
# Repository secrets required (Settings > Secrets and variables > Actions):
#   DEPLOYAGRAM_CLIENT_ID, DEPLOYAGRAM_CLOUD_USERNAME, DEPLOYAGRAM_CLOUD_PASSWORD,
#   DEPLOYAGRAM_LICENSE_KEY, DEPLOYAGRAM_LICENSE
name: Build, test and contract-check AppA for Prod

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTAINER_NAME: AliceA
  BUILD_ID: gha-android-appA-robolectric-junit4-${{ github.run_number }}
  # The host port the Collector is published on. It is not the default (1152), so the tests are told where it is.
  COLLECTOR_PORT: '1253'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Robolectric's Android runtime needs Java 21 to run the tests. The app itself compiles for Java 17.
          java-version: '21'
          cache: gradle

      # Starts the Deployagram Collector on this runner, before the tests need it. The setup action logs in to
      # Deployagram Cloud, pulls the Collector image from ECR, creates the `deployagram` Docker network, and runs
      # the Collector as the `diagram-logger` container, published on host port ${COLLECTOR_PORT}. It then exports
      # DEPLOYAGRAM_COLLECTOR_URL=http://localhost:${COLLECTOR_PORT} for the steps after it. The tests send their
      # recordings there, and the contract steps below read them back from there.
      - name: Set up Deployagram
        id: deployagram
        uses: deployagram/deployagram-github-actions/setup@v1
        with:
          client-id: ${{ secrets.DEPLOYAGRAM_CLIENT_ID }}
          username: ${{ secrets.DEPLOYAGRAM_CLOUD_USERNAME }}
          password: ${{ secrets.DEPLOYAGRAM_CLOUD_PASSWORD }}
          license-key: ${{ secrets.DEPLOYAGRAM_LICENSE_KEY }}
          license: ${{ secrets.DEPLOYAGRAM_LICENSE }}
          collector-port: ${{ env.COLLECTOR_PORT }}

      - name: Build and test with Gradle
        run: |
          ./gradlew assembleDebug testDebugUnitTest --no-daemon
        env:
          DEPLOYAGRAM_LICENSE_KEY: ${{ secrets.DEPLOYAGRAM_LICENSE_KEY }}
          DEPLOYAGRAM_LICENSE: ${{ secrets.DEPLOYAGRAM_LICENSE }}
          DEPLOYAGRAM_CLIENT_ID: ${{ secrets.DEPLOYAGRAM_CLIENT_ID }}
          DEPLOYAGRAM_CLOUD_USERNAME: ${{ secrets.DEPLOYAGRAM_CLOUD_USERNAME }}
          DEPLOYAGRAM_CLOUD_PASSWORD: ${{ secrets.DEPLOYAGRAM_CLOUD_PASSWORD }}
          # The Collector the setup step started, given to the tests explicitly rather than their default (1152).
          DEPLOYAGRAM_COLLECTOR_URL: http://localhost:${{ env.COLLECTOR_PORT }}

      - name: Mark test run complete
        if: ${{ success() }}
        uses: deployagram/deployagram-github-actions/mark-test-run-complete@v1
        with:
          container: ${{ env.CONTAINER_NAME }}
          test-run-id: ${{ env.BUILD_ID }}

      - name: Contract query against the Collector
        id: contract-query
        uses: deployagram/deployagram-github-actions/contract-query@v1
        with:
          container: ${{ env.CONTAINER_NAME }}
          test-run-id: ${{ env.BUILD_ID }}
          environment: Production

      - name: Flush test run to Deployagram Cloud
        if: steps.contract-query.outcome == 'success'
        uses: deployagram/deployagram-github-actions/flush-to-cloud@v1
        with:
          container: ${{ env.CONTAINER_NAME }}

      - name: Contract check against Deployagram Cloud
        id: contract-check
        uses: deployagram/deployagram-github-actions/contract-check@v1
        with:
          token: ${{ steps.deployagram.outputs.token }}
          container: ${{ env.CONTAINER_NAME }}
          build-id: ${{ env.BUILD_ID }}
          environment: Production

      - name: Deploy to Production
        if: steps.contract-check.outcome == 'success'
        run: echo "Deploy your app to Production here"
